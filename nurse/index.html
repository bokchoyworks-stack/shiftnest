<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>勤務の希望入力 | ShiftNest</title>
<link rel="manifest" href="../manifest.webmanifest">
<style>
:root{--bg:#EEF3F2;--surface:#fff;--surface-2:#F6F9F8;--ink:#14262A;--muted:#5A6D70;--line:#D6E0DF;--accent:#0E6B66;--accent-ink:#fff;--accent-soft:#DBEFEC;
--ok:#1B7A4B;--ok-soft:#DDF2E5;--warn:#9A5B00;--warn-soft:#FFF0D6;--bad:#B3243A;--bad-soft:#FBE2E6;--star:#A86E00;--star-soft:#FFF3C9;--sun:#B3243A;--sat:#1E5EA6}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1C;--surface:#172427;--surface-2:#1C2C2F;--ink:#E5EEEE;--muted:#93A6A8;--line:#2A3C3F;--accent:#4FC2B8;--accent-ink:#06211F;--accent-soft:#163A37;
--ok:#5BD08E;--ok-soft:#163626;--warn:#F0B35A;--warn-soft:#3A2C12;--bad:#FF8495;--bad-soft:#3E1C22;--star:#FFD25E;--star-soft:#3A3010;--sun:#FF8495;--sat:#7FB2F0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"Hiragino Sans","BIZ UDPGothic","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.55;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:21px;margin:4px 0 0}
.sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:16px;margin:0 0 10px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=tel],input[type=email],select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.legend span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:12px;text-align:center;color:var(--muted)}
.cal .wd.su{color:var(--sun)}.cal .wd.sa{color:var(--sat)}
.cal button{height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.cal button:active{transform:scale(.94)}
.cal .dn{font-size:11px;color:var(--muted)} .cal .dn.su{color:var(--sun)} .cal .dn.sa{color:var(--sat)}
.cal .mk{font-size:21px;font-weight:700;line-height:1.1}
.m0{color:var(--muted);opacity:.55}.m1{color:var(--accent)}.m2{color:var(--warn)}.m3{color:var(--bad)}.m4{color:var(--star)}.m5{color:var(--accent)}.m6,.m7,.m8{color:var(--sat)}
.cal button.v5,.cal button.v6,.cal button.v7,.cal button.v8{border:1.5px solid currentColor;border-color:var(--sat)}.cal button.v5{border-color:var(--accent)}
.cal button.v9{background:var(--accent);border-color:var(--accent)}.cal button.v10,.cal button.v11,.cal button.v12{background:var(--sat);border-color:var(--sat)}
.cal button.v9 .mk,.cal button.v10 .mk,.cal button.v11 .mk,.cal button.v12 .mk,.cal button.v9 .dn,.cal button.v10 .dn,.cal button.v11 .dn,.cal button.v12 .dn{color:#fff}
.legend b.m9,.legend b.m10,.legend b.m11,.legend b.m12{color:#fff;border-radius:6px;padding:0 4px}.legend b.m9{background:var(--accent)}.legend b.m10,.legend b.m11,.legend b.m12{background:var(--sat)}
.cal button.v1{background:var(--accent-soft);border-color:transparent}.cal button.v2{background:var(--warn-soft);border-color:transparent}.cal button.v3{background:var(--bad-soft);border-color:transparent}.cal button.v4{background:var(--star-soft);border-color:transparent}
.cal button.fx{background:var(--surface-2);border-style:dashed;cursor:default}
.cal button.lv{background:var(--ok-soft);border:1.5px dashed var(--ok)}
.cal .tag{font-size:10px;font-weight:700;color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lock{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:1px 8px}
.note{font-size:13px;color:var(--muted)}
.box{border-radius:12px;padding:10px 12px;font-size:14px}
.box.ok{background:var(--ok-soft)}.box.star{background:var(--star-soft)}.box.warn{background:var(--warn-soft)}.box.info{background:var(--accent-soft)}
.qr{background:#fff;border-radius:14px;padding:12px;display:flex;justify-content:center}
.qr svg{width:100%;max-width:300px;height:auto}
code.tok{display:block;font-size:11px;word-break:break-all;background:var(--surface-2);border-radius:8px;padding:8px;max-height:70px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.pal{display:flex;flex-direction:column;gap:6px}
.pr{display:flex;gap:6px;align-items:stretch}
.pl{font-size:11px;color:var(--muted);width:28px;flex:none;align-self:center;line-height:1.2}
.pb{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 2px;font-size:11px;font-weight:700;color:var(--ink);min-width:0}
.pb.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pb .mk{font-size:18px;min-width:22px;text-align:center;line-height:1.3}
.pb .mk.fill{color:#fff;border-radius:6px;padding:0 5px}.pb .mk.f9{background:var(--accent)}.pb .mk.f10,.pb .mk.f11,.pb .mk.f12{background:var(--sat)}
.pb .mk.lvk{color:var(--ok)}
.m6{color:var(--sat)}
[hidden]{display:none!important}
.rec{border:1.5px solid var(--accent);border-radius:14px;padding:12px;background:var(--accent-soft)}
.rec .cn{font-size:22px;font-weight:800;letter-spacing:.06em;font-family:ui-monospace,Menlo,monospace}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hist div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--surface)}
#print{display:none}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700}
.steps span{padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps span.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;margin-top:10px}
.choice b{display:block;font-size:16px}.choice small{color:var(--muted);font-size:13px}
.choice .ic{font-size:26px;flex:none;width:34px;text-align:center}
.me{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:14px}
.me .av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.flow{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.flow div{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.flow i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.gdots{display:flex;gap:6px;justify-content:center;margin:12px 0}.gdots b{width:8px;height:8px;border-radius:50%;background:var(--line)}.gdots b.on{background:var(--ink)}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px}
@media print{body{background:#fff;color:#000;padding:0}main,.toast{display:none!important}#print{display:block;font-size:12pt;color:#000}
#print h1{font-size:16pt;margin:0 0 4pt}#print table{border-collapse:collapse;width:100%;margin-top:8pt}#print td,#print th{border:.5pt solid #888;padding:3pt 5pt;font-size:10.5pt;text-align:left}
#print .cn{font-size:18pt;font-weight:800;letter-spacing:.06em}}
</style>
</head>
<body>
<main id="app"><div class="card">読み込み中…</div></main>
<div class="toast" id="toast"></div>
<div id="print"></div>
<script src="../vendor/qrcode.js"></script>
<script src="../common/holidays.js"></script>
<script src="../common/codec.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD='日月火水木金土',MARK=['◯','・','△','×','★','日','夜','準','深','日','夜','準','深'],MARK_TXT=['どちらでもOK','できれば勤務OK','できれば休み','希望休','優先休み','日勤がいい','夜勤がいい','準夜がいい','深夜がいい','業務で日勤','業務で夜勤','業務で準夜','業務で深夜'];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400);}
function qrSvg(text){const q=qrcode(0,'L');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});}
const S={};
function parseHash(){
  const h=location.hash.slice(1),p=new URLSearchParams(h);
  S.unlocked=false;
  try{if(p.get('i')){S.kind='invite';S.inv=SNCodec.b64Json(p.get('i'));}
      else if(p.get('q')){S.kind='req';S.inv=SNCodec.b64Json(p.get('q'));}}catch(e){S.kind='bad';}
}
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ---------- 送った記録（控え）。確認番号は管理者のアプリの「受け取った記録」と同じ ---------- */
function newCn(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint8Array(8);crypto.getRandomValues(r);const s=[...r].map(x=>A[x%A.length]).join('');return s.slice(0,4)+'-'+s.slice(4);}
function stampNow(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+z(d.getMonth()+1)+'/'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
/* 管理者側（iOS AppStore.summarize）と同じ書き方 */
function summarize(p,lvn){const c=f=>p.filter(f).length;
  const it=[['希望休',c(q=>q===3)],['優先休み',c(q=>q===4)],['できれば休み',c(q=>q===2)],['勤務の希望',c(q=>q>=5&&q<=8)],['業務',c(q=>q>=9)],['有休申請',lvn]].filter(x=>x[1]>0);
  return it.length?it.map(x=>x[0]+x[1]+'日').join('・'):'希望なし（すべてどちらでもOK）';}
function recKey(){return 'sn-rec-'+String(S.inv.k||S.inv.w).slice(-16);}
function recList(){return store.get(recKey())||[];}
function addRec(r){const a=recList();a.unshift(r);store.set(recKey(),a.slice(0,60));}
function lastRecFor(ym,name){return recList().find(r=>r.ym===ym&&r.name===name);}
function printRec(r){
  const [y,m]=r.ym.split('-').map(Number);
  $('#print').innerHTML=`<h1>勤務の希望　送信の控え</h1>
    <p>${esc(r.w||'')}　${y}年${m}月分　${esc(r.name)}さん</p>
    <p>送った日時：${esc(r.at)}<br>確認番号：<span class="cn">${esc(r.cn)}</span></p>
    <p>まとめ：${esc(r.sum)}</p>
    <table><tr><th>日</th><th>希望</th></tr>${(r.days||[]).map(([d,t])=>`<tr><td>${m}/${d}</td><td>${esc(t)}</td></tr>`).join('')||'<tr><td colspan="2">特になし（すべてどちらでもOK）</td></tr>'}</table>
    <p style="margin-top:10pt;font-size:9.5pt">管理者のアプリの「受け取った記録」に同じ確認番号があれば、この内容が届いています。夜勤で一緒にならないようにしたい人は、控えにも載せていません。</p>`;
  setTimeout(()=>window.print(),50);
}
function recCard(r,title){return `<div class="rec"><div class="note" style="color:var(--ink)">${title}</div>
  <div class="cn">${esc(r.cn)}</div><div class="note">確認番号・${esc(r.at)}</div><div style="margin-top:6px;font-size:14px">${esc(r.sum)}</div>
  <button class="btn block" data-print="${esc(r.cn)}" style="margin-top:8px">控えを保存（PDF・印刷）</button>
  <p class="note" style="margin:6px 0 0">「PDF・印刷」→ 共有 →「ファイルに保存」でPDFになります。管理者のアプリにも同じ確認番号が残ります。</p></div>`;}
function histHtml(){const a=recList().filter(r=>r.ym===S.inv.ym);if(!a.length)return '';
  return `<details style="margin-top:10px"><summary class="note">この月に送った記録（${a.length}件）</summary><div class="hist">${a.map(r=>`<div><b>${esc(r.at)}</b>　${esc(r.name)}　<span style="font-family:ui-monospace,Menlo,monospace">${esc(r.cn)}</span><br>${esc(r.sum)}<br><button class="btn" data-print="${esc(r.cn)}" style="padding:6px 10px;margin-top:4px;font-size:13px">控えを保存</button></div>`).join('')}</div></details>`;}
/* ---------- 本人確認：このスマホが本人を覚える（本人キー）＋自分で決めた暗証番号 ---------- */
function meKey(){return 'sn-me-'+String(S.inv.k||S.inv.w).slice(-16);}
function normName(n){return String(n||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();}
async function sha(b64){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(b64));return SNCodec.b64u.enc(new Uint8Array(d));}
async function makeMe(name,pin,id){const r=new Uint8Array(32);crypto.getRandomValues(r);const sk=SNCodec.b64u.enc(r);
  return {name,id:id||0,sk,kh:await sha(sk),rk:SNCodec.b64u.enc(await SNCodec.reqKey(pin,name)),at:stampNow()};}
function rosterIdByName(n){const t=normName(n),hit=(S.inv.s||[]).filter(([,x])=>normName(x)===t);return hit.length===1?hit[0]:null;}
function stepBar(cur){const L=['本人確認','希望を入れる','送る'];return `<div class="steps">${L.map((t,i)=>`<span class="${i===cur?'on':i<cur?'ok':''}">${i<cur?'✓ ':(i+1)+'. '}${t}</span>`).join('')}</div>`;}
const PINRE=/^\d{4}$/;
/* はじめての人向けの説明（4枚） */
const GUIDE=[
  ['このページでできること','<p>来月の勤務の<b>希望</b>（休みたい日・勤務したい日）を、管理者に送ります。<b>2分</b>で終わります。</p><div class="box info">入れた内容は暗号になって管理者のアプリにだけ届きます。ほかの人やアプリの開発者には見えません。</div>'],
  ['流れ（3ステップ）','<div class="flow"><div><i>1</i><span><b>本人確認</b>：はじめてだけ、名前と暗証番号（自分で決める数字4けた）を入れます。2回目からはこのスマホが覚えています。</span></div><div><i>2</i><span><b>希望を入れる</b>：カレンダーの日をタップ。</span></div><div><i>3</i><span><b>送る</b>：LINEやメールで管理者へ。控え（確認番号）が残ります。</span></div></div>'],
  ['例：15日を休みたい、20日はできれば休み','<p>カレンダーの <b>15日</b> を1回タップ → <b style="color:var(--bad)">×</b>（希望休）<br><b>20日</b> を2回タップ → <b style="color:var(--warn)">△</b>（できれば休み）</p><p>タップするたびに ◯ → × → △ → 日 → 夜 → ◯ と変わります。何もしない日は「◯ どちらでもOK」です。</p>'],
  ['暗証番号について','<p>自分で決める<b>数字4けた</b>です（例：誕生日以外の番号）。</p><ul style="padding-left:20px;margin:6px 0"><li>スマホを変えたときに、本人だと確かめるのに使います</li><li>管理者からの「お願い」を開くのに使います</li></ul><div class="box warn">他人に教えないでください。忘れても大丈夫：このスマホなら変えられます。別のスマホなら、管理者が本人と確かめて切り替えます。</div>']
];
function renderGuide(head){const i=S.gi||0,g=GUIDE[i];
  $('#app').innerHTML=head+`<div class="card"><p class="note" style="margin:0">使い方 ${i+1} / ${GUIDE.length}</p><h2 style="font-size:19px;margin:4px 0 10px">${g[0]}</h2>${g[1]}
    <div class="gdots">${GUIDE.map((_,k)=>`<b class="${k===i?'on':''}"></b>`).join('')}</div>
    <div class="row" style="flex-wrap:nowrap">${i>0?'<button class="btn" id="gPrev" style="flex:1">戻る</button>':''}<button class="btn primary" id="gNext" style="flex:2">${i<GUIDE.length-1?'次へ':'はじめる'}</button></div>
    <div style="text-align:center;margin-top:8px"><button class="linkbtn" id="gSkip">説明をとばす</button></div></div>`;
  const done=()=>{store.set('sn-guide-seen',1);S.gi=0;S.step='who';render();window.scrollTo(0,0);};
  $('#gNext').onclick=()=>{if(i<GUIDE.length-1){S.gi=i+1;render();}else done();};
  const pv=$('#gPrev');if(pv)pv.onclick=()=>{S.gi=i-1;render();};$('#gSkip').onclick=done;}
function bindPrint(){document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const r=recList().find(x=>x.cn===b.dataset.print);if(r)printRec(r);});}

/* ---------- 招待：希望入力 ---------- */
function setupInvite(){
  const inv=S.inv,[y,m]=inv.ym.split('-').map(Number);
  S.days=monthDays(y,m-1,!!inv.ye);
  const draft=store.get(draftKey())||{};
  S.step=draft.step&&draft.step!=='done'?draft.step:'who';
  S.id=draft.id||0;S.name=draft.name||'';S.p=draft.p||new Array(S.days.length).fill(0);
  S.lv=draft.lv||[];S.ng=draft.ng||[];S.pv=draft.pv||[-1,-1];S.mr=draft.mr||{};S.mrText='';S.em=store.get('sn-em')||'';S.mode='pref';
  S.me=store.get(meKey());S.whoMode='';
  if(S.me){S.name=S.me.name;S.id=S.me.id||0;}
  if(S.step==='cal'&&!S.me)S.step='who';
  if(S.step==='who'&&!S.me&&!store.get('sn-guide-seen'))S.step='guide';
}
/* 名簿が読めたら、自分のIDを名前から見つける（承認された後の月） */
function linkMeToRoster(){if(!S.me||S.me.id)return;const hit=rosterIdByName(S.me.name);if(hit){S.me.id=hit[0];store.set(meKey(),S.me);S.id=hit[0];}}
/* 下書きは「職場（管理者の鍵）×月」ごとに分ける。同じ職場名の別施設と混ざらない */
function draftKey(){return 'sn-draft-'+S.inv.ym+'-'+String(S.inv.k||S.inv.w).slice(-24);}
function saveDraft(){store.set(draftKey(),{step:S.step,id:S.id,name:S.name,p:S.p,lv:S.lv,ng:S.ng,pv:S.pv,mr:S.mr});}
function fixedDays(){return new Set(((S.inv.fx||{})[S.id]||[]).map(Number));}
function hasStar(){return (S.inv.cr||[]).includes(S.id);}
function renderInvite(){

  const head=`<div><h1>${mm}月の勤務の希望</h1><p class="sub">${esc(inv.w)}・締切 ${esc(inv.dl||'')}</p></div>`;
  if(S.step==='guide')return renderGuide(head);
  if(S.step==='who'){
    linkMeToRoster();
    const help='<div style="text-align:right;margin-top:6px"><button class="linkbtn" id="toGuide">使い方を見る</button></div>';
    if(S.me&&S.whoMode!=='pin'){
      app.innerHTML=head+stepBar(0)+`<div class="card"><div class="me"><div class="av">${esc([...S.me.name][0]||'?')}</div><div><b style="font-size:18px">${esc(S.me.name)}さん</b><div class="note">このスマホで本人確認ずみです</div></div></div>
        <button class="btn primary block" id="goCal" style="margin-top:12px">希望を入力する</button>
        <label class="f" for="em">連絡用メール（任意）</label><input type="email" id="em" autocomplete="email" placeholder="例：name@example.com" value="${esc(S.em||'')}">
        <label class="note" style="display:flex;gap:8px;align-items:flex-start;margin-top:6px"><input type="checkbox" id="emok" ${S.em?'checked':''} style="margin-top:4px"> このアドレスを職場の管理者に渡し、勤務の案内メールに使うことに同意します</label>
        <div class="row" style="justify-content:space-between;margin-top:10px"><button class="linkbtn" id="toPin">暗証番号を変える</button><button class="linkbtn" id="notMe">${esc(S.me.name)}さんではない</button></div>${help}${histHtml()}</div>`;
      $('#goCal').onclick=()=>{S.em=($('#em').value||'').trim();if(S.em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.em)){toast('メールアドレスを確かめてください');return;}if(S.em&&!$('#emok').checked){toast('メールを使うときは同意にチェックしてください');return;}store.set('sn-em',S.em);
        S.name=S.me.name;S.id=S.me.id||0;S.step='cal';saveDraft();render();window.scrollTo(0,0);};
      $('#toPin').onclick=()=>{S.whoMode='pin';render();};
      $('#notMe').onclick=()=>{if(!confirm('このスマホの本人確認を消して、別の人として入力しますか？\n（'+S.me.name+'さんは、次に使うとき名前と暗証番号を入れ直すことになります）'))return;
        try{localStorage.removeItem(meKey());}catch(e){}S.me=null;S.whoMode='';render();};
    }else if(S.me&&S.whoMode==='pin'){
      app.innerHTML=head+`<div class="card"><h2>暗証番号を変える</h2>
        <label class="f" for="op">いまの暗証番号</label><input type="tel" id="op" inputmode="numeric" maxlength="4" autocomplete="off">
        <label class="note" style="display:flex;gap:8px;margin-top:6px"><input type="checkbox" id="forgot"> 忘れた（このスマホなので、そのまま新しくできます）</label>
        <label class="f" for="np1">新しい暗証番号（数字4けた）</label><input type="tel" id="np1" inputmode="numeric" maxlength="4" autocomplete="off">
        <label class="f" for="np2">もう一度</label><input type="tel" id="np2" inputmode="numeric" maxlength="4" autocomplete="off">
        <button class="btn primary block" id="pinGo" style="margin-top:12px">変更する</button><button class="btn block" id="pinBack" style="margin-top:8px">やめる</button>
        <p class="note">新しい暗証番号は、次に希望を送ったときに管理者のアプリにも伝わります。</p></div>`;
      $('#forgot').onchange=e=>{$('#op').disabled=e.target.checked;};
      $('#pinBack').onclick=()=>{S.whoMode='';render();};
      $('#pinGo').onclick=async()=>{const n1=$('#np1').value.trim(),n2=$('#np2').value.trim();
        if(!$('#forgot').checked){const old=SNCodec.b64u.enc(await SNCodec.reqKey($('#op').value.trim(),S.me.name));if(old!==S.me.rk){toast('いまの暗証番号が違います');return;}}
        if(!PINRE.test(n1)){toast('新しい暗証番号は数字4けたです');return;}if(n1!==n2){toast('2回の入力が違います');return;}
        if(!confirm('暗証番号を変えますか？'))return;
        S.me.rk=SNCodec.b64u.enc(await SNCodec.reqKey(n1,S.me.name));store.set(meKey(),S.me);S.whoMode='';toast('暗証番号を変えました');render();};
    }else if(!S.whoMode){
      app.innerHTML=head+stepBar(0)+`<div class="card"><h2>あなたはどちらですか？</h2>
        <button class="choice" id="cNew"><span class="ic">🆕</span><span><b>はじめて使う</b><small>名前と暗証番号を登録して、そのまま希望も入れます。管理者が承認すると登録されます。</small></span></button>
        <button class="choice" id="cOld"><span class="ic">📱</span><span><b>前にも使った（スマホを変えた など）</b><small>名前と暗証番号で本人確認します。管理者が確かめてから受け取ります。</small></span></button>${help}${histHtml()}</div>`;
      $('#cNew').onclick=()=>{S.whoMode='new';render();};$('#cOld').onclick=()=>{S.whoMode='old';render();};
    }else{
      const isNew=S.whoMode==='new';
      app.innerHTML=head+stepBar(0)+`<div class="card"><h2>${isNew?'はじめての登録':'前にも使った人'}</h2>
        <label class="f" for="nm">${isNew?'勤務表に載せる名前（苗字やニックネーム）':'登録した名前'}</label><input type="text" id="nm" maxlength="10" autocomplete="off" placeholder="例：山田">
        <label class="f" for="p1">${isNew?'暗証番号（自分で決める数字4けた）':'暗証番号（数字4けた）'}</label><input type="tel" id="p1" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="例：2580">
        ${isNew?'<label class="f" for="p2">暗証番号をもう一度</label><input type="tel" id="p2" inputmode="numeric" maxlength="4" autocomplete="off">':''}
        <label class="f" for="em">連絡用メール（任意）</label><input type="email" id="em" autocomplete="email" placeholder="例：name@example.com" value="${esc(S.em||'')}">
        <label class="note" style="display:flex;gap:8px;align-items:flex-start;margin-top:6px"><input type="checkbox" id="emok" ${S.em?'checked':''} style="margin-top:4px"> このアドレスを職場の管理者に渡し、勤務の案内メールに使うことに同意します（入れた人だけ）</label>
        <p class="note">${isNew?'暗証番号は、スマホを変えたときの本人確認と、管理者からの「お願い」を開くときに使います。他人に教えないでください。':'暗証番号を忘れた人も、そのまま新しい番号を入れて進めてください。管理者が本人と確かめてから受け取ります。'}</p>
        <button class="btn primary block" id="next1">次へ（希望を入れる）</button><button class="btn block" id="back1" style="margin-top:8px">戻る</button></div>`;
      $('#back1').onclick=()=>{S.whoMode='';render();};
      $('#next1').onclick=async()=>{const n=$('#nm').value.trim(),p1=$('#p1').value.trim();
        if(!n){toast('名前を入れてください');return;}if(!PINRE.test(p1)){toast('暗証番号は数字4けたです');return;}
        if(isNew&&p1!==$('#p2').value.trim()){toast('暗証番号が2回で違います');return;}
        S.em=($('#em').value||'').trim();if(S.em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.em)){toast('メールアドレスを確かめてください');return;}if(S.em&&!$('#emok').checked){toast('メールを使うときは同意にチェックしてください');return;}store.set('sn-em',S.em);
        let id=0,name=n;
        if(isNew){if(rosterIdByName(n)&&!confirm('「'+n+'」さんはもう名簿にいます。\n同じ名前の別の人として登録しますか？（本人なら「キャンセル」→「前にも使った」へ）'))return;}
        else{const hit=rosterIdByName(n);if(!hit){toast('名簿に「'+n+'」さんが見つかりません。名前を確かめてください');return;}id=hit[0];name=hit[1];}
        S.me=await makeMe(name,p1,id);store.set(meKey(),S.me);S.name=name;S.id=id;S.whoMode='';S.step='cal';saveDraft();render();window.scrollTo(0,0);};
    }
    const tg=$('#toGuide');if(tg)tg.onclick=()=>{S.gi=0;S.step='guide';render();};
    bindPrint();
    return;
  }
  if(S.step==='cal'){
    const fx=fixedDays(),lead=S.days[0].dow,star=hasStar();const sp=S.sp||'';
    const seq=star?[0,3,4,2,5,6]:[0,3,2,5,6];
    const LBL={0:'どちらでもOK',3:'希望休',4:'優先休み',2:'できれば休み',5:'日勤がいい',6:'夜勤がいい'};
    app.innerHTML=head+stepBar(1)+`<div class="card"><h2>日をタップして希望を入れる（${esc(S.name)}さん）</h2>
      ${sp==='l'?`<div class="box ok"><b>有休を申請する日をタップ</b>（もう一度で取り消し）。管理者が承認すると「有給」になります。<button class="btn primary block" data-sp="" style="margin-top:8px">終わり（ふつうの入力に戻る）</button></div>`:
        sp==='m'?`<div class="box info"><b>業務がある日をタップ</b>（会議・研修など、仕事で外せない日）。押すたびに <b>業務で日勤 → 業務で夜勤 → なし</b>。管理者が確認すると確定し、それまでは「日勤がいい・夜勤がいい」と同じ扱いです。
          <label class="f" for="mrr">業務の内容（必ず入れてください）</label><input type="text" id="mrr" maxlength="40" placeholder="例：会議、研修、委員会" value="${esc(S.mrText||'')}">
          <button class="btn primary block" data-sp="" style="margin-top:8px">終わり（ふつうの入力に戻る）</button></div>`:
        `<div class="legend" style="margin:0 0 4px">${seq.map(q=>`<span><b class="m${q}">${MARK[q]}</b> ${LBL[q]}</span>`).join('<span style="border:0;padding:0">→</span>')}</div>
      <p class="note" style="margin:0">タップするたびに順に変わり、また◯に戻ります。「夜」＝${inv.md==='2'?'夜勤':'準夜か深夜'}。</p>`}
      <div class="cal" style="margin-top:10px">${[...WD].map((w,i)=>`<div class="wd ${i===0?'su':i===6?'sa':''}">${w}</div>`).join('')}${'<div></div>'.repeat(lead)}
      ${S.days.map((d,i)=>{const dn=`<span class="dn ${d.dow===0||d.name?'su':d.dow===6?'sa':''}">${d.day}</span>`;
        if(fx.has(d.day))return `<button class="fx" disabled>${dn}<span class="tag">有給</span></button>`;
        if(S.lv.includes(d.day))return `<button class="lv" data-d="${i}">${dn}<span class="tag">有休申請</span></button>`;
        const q=S.p[i];return `<button class="v${q}" data-d="${i}" aria-label="${d.day}日 ${MARK_TXT[q]}">${dn}<span class="mk m${q}">${MARK[q]}</span></button>`;}).join('')}</div>
      ${sp?'':`<div class="row" style="margin-top:10px"><button class="btn" data-sp="l" style="flex:1">有休を申請する</button><button class="btn" data-sp="m" style="flex:1">業務がある日</button></div>
      <p class="note" style="margin:6px 0 0">「業務がある日」＝会議・研修など、仕事で日勤や夜勤に入る必要がある日。</p>`}
      </div>
      ${pvCard()}
      <div class="card"><h2>夜勤で一緒にならないようにしたい人（任意・2人まで）</h2><p class="note" style="margin:-4px 0 8px"><span class="lock">管理者にも見えません</span> アプリの中だけで使います。</p>
      <div class="chips">${(inv.s||[]).filter(([id])=>id!==S.id).map(([id,n])=>`<button data-ng="${id}" aria-pressed="${S.ng.includes(id)}">${esc(n)}</button>`).join('')}</div></div>
      <button class="btn primary block" id="send">管理者に送る</button>
      <button class="btn block" id="back">本人確認の画面に戻る</button>
      <p class="note">入力した内容は暗号化され、職場の管理者のiPhoneでだけ開けます。アプリの開発者には一切届きません。<a href="../privacy/">プライバシーについて</a></p>`;
    app.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{S.sp=b.dataset.sp;render();});
    {const mrr=$('#mrr');if(mrr)mrr.oninput=e=>{S.mrText=e.target.value;};}
    app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d,day=S.days[i].day,sp=S.sp||'';
      const k=S.lv.indexOf(day);
      if(sp==='l'){if(k>=0)S.lv.splice(k,1);else{S.lv.push(day);S.p[i]=0;delete S.mr[day];}}
      else if(sp==='m'){if(!(S.mrText||'').trim()){toast('上に業務の内容を入れてください');return;}
        if(k>=0)S.lv.splice(k,1);const ms=[0,9,10],j=ms.indexOf(S.p[i]);S.p[i]=ms[(j<0?1:j+1)%3];
        if(S.p[i]>=9)S.mr[day]=S.mrText.trim();else delete S.mr[day];}
      else{if(k>=0){S.lv.splice(k,1);S.p[i]=0;}
        else{const sq=hasStar()?[0,3,4,2,5,6]:[0,3,2,5,6];let j=sq.indexOf(S.p[i]),nv=j<0?0:sq[(j+1)%sq.length];
          if(nv===4&&S.p.some((q,x)=>q===4&&x!==i))nv=sq[(sq.indexOf(4)+1)%sq.length];
          S.p[i]=nv;delete S.mr[day];}}
      saveDraft();render();});
    app.querySelectorAll('[data-ng]').forEach(b=>b.onclick=()=>{const id=+b.dataset.ng,k=S.ng.indexOf(id);if(k>=0)S.ng.splice(k,1);else{if(S.ng.length>=2){toast('2人までです');return;}S.ng.push(id);}saveDraft();render();});
    app.querySelectorAll('[data-pv]').forEach(el=>el.onchange=()=>{S.pv[+el.dataset.pv]=+el.value;saveDraft();});
    $('#back').onclick=()=>{S.step='who';render();};
    $('#send').onclick=async()=>{
      if(!S.me){S.step='who';render();toast('先に本人確認をしてください');return;}
      {const prev=lastRecFor(inv.ym,S.name);if(!confirm('管理者に送りますか？'+(prev?'\n\n前回は '+prev.at+' に送っています。送り直すと、最後に送った内容が使われます。':'')))return;}
      $('#send').disabled=true;$('#send').textContent='暗号化しています…';
      try{const rk=S.me.rk,kh=S.me.kh;S.name=S.me.name;S.id=S.me.id||0;
        const cn=newCn(),at=stampNow();
        S.token=await SNCodec.sealToPub(inv.k,{t:'ans',ym:inv.ym,r:inv.r||0,cn,at,kh,nw:S.me.id?undefined:1,id:S.id,name:S.name,p:S.p.map(q=>q<10?String(q):String.fromCharCode(87+q)).join(''),ng:S.ng,lv:S.lv.slice().sort((a,b)=>a-b),rk,pv:inv.pv&&S.pv.every(x=>x>=0)?S.pv:undefined,em:S.em||undefined,mr:(()=>{const o={};S.p.forEach((q,i)=>{const dd=S.days[i].day;if(q>=9&&S.mr[dd])o[dd]=S.mr[dd];});return Object.keys(o).length?o:undefined;})()});
        const mk=['','・','できれば休み','希望休','優先休み','日勤がいい',inv.md==='2'?'夜勤がいい':'夜勤がいい','準夜がいい','深夜がいい'];
        const days=[];S.days.forEach((d,i)=>{const q=S.p[i];if(S.lv.includes(d.day))days.push([d.day,'有休申請']);else if(q>=9)days.push([d.day,MARK_TXT[q]+(S.mr[d.day]?'（'+S.mr[d.day]+'）':'')]);else if(q>1)days.push([d.day,mk[q]]);});
        S.rec={ym:inv.ym,w:inv.w,name:S.name,cn,at,sum:summarize(S.p,S.lv.length),days};addRec(S.rec);
        S.step='done';saveDraft();render();window.scrollTo(0,0);}catch(e){toast('送れませんでした：'+e.message);$('#send').disabled=false;$('#send').textContent='管理者に送る';}};
    return;
  }
  if(S.step==='done'){renderSend(head+stepBar(2),'回答ができました',(S.me&&!S.me.id?'<b>はじめての登録です。管理者が承認すると、この希望がそのまま入ります。</b><br>':'')+'もう一度直したいときは「直す」から。最後に送ったものが使われます。',()=>{S.step='cal';render();});
    const r=S.rec||lastRecFor(inv.ym,S.name);if(r){$('#app').insertAdjacentHTML('beforeend',`<div class="card">${recCard(r,'送信の控え（言った・言わないを防ぐため、保存しておくと安心です）')}${histHtml()}</div>`);bindPrint();}}
}
function workSeq(){const b=S.inv.md==='2'?[5,6]:[5,7,8];return [0,...b.map(q=>S.must?q+4:q)];}
function pvCard(){
  const inv=S.inv;if(!inv.pv)return '';
  const [y,m]=inv.ym.split('-').map(Number),last=new Date(y,m-1,0),pm=last.getMonth()+1,ld=last.getDate();
  const opts=inv.md==='2'?[[0,'休み'],[1,'日勤'],[4,'夜勤'],[5,'明け'],[6,'有給']]:[[0,'休み'],[1,'日勤'],[2,'準夜'],[3,'深夜'],[6,'有給']];
  const sel=i=>`<select data-pv="${i}" aria-label="${pm}月${ld-1+i}日の勤務"><option value="-1">選んでください</option>${opts.map(([v,t])=>`<option value="${v}" ${S.pv[i]===v?'selected':''}>${t}</option>`).join('')}</select>`;
  return `<div class="card"><h2>先月の最後の2日の勤務（はじめての月だけ）</h2><p class="note" style="margin:-4px 0 8px">夜勤明けの次の日に日勤が入らないようにするために使います。</p>
    <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label class="f">${pm}月${ld-1}日</label>${sel(0)}</div><div style="flex:1"><label class="f">${pm}月${ld}日</label>${sel(1)}</div></div></div>`;
}
function renderSend(head,title,foot,onBack){
  const tok=S.token,link='shiftnest://a?d='+tok;
  $('#app').innerHTML=head+`<div class="card"><h2>${title}</h2>
    <p class="note" style="margin:0 0 10px">次のどれかで管理者に渡してください。中身は暗号化されていて、管理者のアプリでしか開けません。</p>
    <div class="box info"><b>A. 管理者に画面を見せる</b>（いちばん確実）<br>管理者がアプリでこのQRコードを読み取ります。</div>
    <div class="qr" style="margin:10px 0">${qrSvg(tok)}</div>
    <div class="box info"><b>B. メール・メッセージで送る</b></div>
    <div class="row" style="margin:8px 0 12px"><button class="btn" id="share">送る（メール・LINEなど）</button><button class="btn" id="copy">コピー</button></div>
    <code class="tok" id="tok">${esc(tok)}</code>
    <p class="note">管理者から「提出用のLINEグループ」に送るよう言われている場合は、そこに送ってください。管理者が全員分をまとめて取り込めます。中身は暗号化されていて、グループのほかの人には読めません。</p>
    <p class="note">${foot}</p>
    ${onBack?'<button class="btn block" id="again">直す</button>':''}</div>`;
  const text='ShiftNestの回答です。管理者のアプリで受け取ってください。\n'+link+'\n\n（開けないときは次の文字をアプリに貼り付け）\n'+tok;
  $('#share').onclick=async()=>{if(navigator.share){try{await navigator.share({text});}catch(e){}}else{location.href='mailto:?subject='+encodeURIComponent('勤務の希望（ShiftNest）')+'&body='+encodeURIComponent(text);}};
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('コピーしました');}catch(e){const r=document.createRange();r.selectNodeContents($('#tok'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('選択しました。コピーしてください');}};
  if(onBack)$('#again').onclick=onBack;
}

/* ---------- お願いリンク ---------- */
function renderReq(){
  const inv=S.inv,[,mm]=inv.ym.split('-').map(Number),app=$('#app');
  const head=`<div><h1>${mm}月の勤務表についてのお願い</h1><p class="sub">あなたへのお願いがあるときだけ表示されます。</p></div>`;
  if(!S.reqStep){
    const me=store.get(meKey());
    const openWith=async(id,name,rk)=>{const item=(inv.items||{})[id];S.id=id;S.name=name;
      if(!item){S.reqStep='none';render();return true;}
      try{S.req=await SNCodec.openReq(SNCodec.b64u.dec(rk),item);S.reqStep='ask';render();return true;}catch(e){return false;}};
    if(me&&me.rk&&!S.reqManual){
      const id=me.id||((rosterIdByName(me.name)||[])[0]);
      if(id){app.innerHTML=head+'<div class="card">'+esc(me.name)+'さんへのお願いを確かめています…</div>';
        openWith(id,me.name,me.rk).then(ok=>{if(!ok){S.reqManual=true;toast('暗証番号が変わっているようです。入れ直してください');render();}});return;}
    }
    app.innerHTML=head+`<div class="card"><label class="f" for="nm">あなたの名前</label><input type="text" id="nm" maxlength="10" autocomplete="off" placeholder="例：山田">
      <label class="f" for="pin">暗証番号（数字4けた）</label><input type="tel" id="pin" inputmode="numeric" maxlength="4" autocomplete="off">
      <button class="btn primary block" id="open" style="margin-top:12px">開く</button></div>`;
    $('#open').onclick=async()=>{const n=$('#nm').value.trim(),pin=$('#pin').value.trim();if(!n||!PINRE.test(pin)){toast('名前と暗証番号を入れてください');return;}
      const hit=rosterIdByName(n);if(!hit){toast('名簿に見つかりません。名前を確かめてください');return;}
      const rk=SNCodec.b64u.enc(await SNCodec.reqKey(pin,hit[1]));if(!await openWith(hit[0],hit[1],rk))toast('暗証番号が違うようです');};
    return;
  }
  if(S.reqStep==='none'){app.innerHTML=head+`<div class="card"><h2>今回はお願いはありません</h2><p class="note">${esc(S.name)}さん、ありがとうございました。</p></div>`;return;}
  if(S.reqStep==='ask'){
    app.innerHTML=head+`<div class="card"><h2>${esc(S.name)}さんへ</h2><p style="font-size:17px">${esc(S.req.msg)}</p><p class="note">ほかの日の希望は変わりません。むりなら断って大丈夫です（理由は聞きません）。</p>
      <div class="row"><button class="btn primary" id="yes" style="flex:1">入れる</button><button class="btn" id="no" style="flex:1">むり</button></div></div>`;
    const answer=async ok=>{if(ok&&!confirm('「入れる」と返事をしますか？'))return;S.token=await SNCodec.sealToPub(inv.k,{t:'req-ok',ym:inv.ym,r:inv.r||0,id:S.id,d:S.req.d,ok});
      if(!ok){app.innerHTML=head+'<div class="card"><h2>わかりました</h2><p class="note">返事は送らなくて大丈夫です。</p></div>';return;}
      renderSend(head,'ありがとうございます','管理者がアプリに取り込み、勤務表を更新すると反映されます。何人かがOKした場合は、アプリが1人を選びます。',null);};
    $('#yes').onclick=()=>answer(true);$('#no').onclick=()=>answer(false);
  }
}
function render(){
  if((S.kind==='invite'||S.kind==='req')&&S.inv&&S.inv.e&&!S.unlocked)return renderPass();
  if(S.kind==='invite')return renderInvite();
  if(S.kind==='req')return renderReq();
  $('#app').innerHTML=`<div class="card"><h1>ShiftNest</h1><p>職場に貼ってある招待QRコードから開いてください。</p><p class="note">このページはスタッフの勤務の希望を入力するためのものです。</p></div>`;
}
/* 職場の合言葉：招待・お願いリンクの名簿は合言葉がないと読めない */
function wpKey(){return 'sn-wp-'+String(S.inv.k||'').slice(-16);}
async function unlock(pass,silent){
  try{const key=await SNCodec.reqKey(String(pass).normalize('NFKC').trim(),'inv-'+String(S.inv.k).slice(-16));
    const d=await SNCodec.openReq(key,S.inv.e);Object.assign(S.inv,d);S.unlocked=true;store.set(wpKey(),pass);render();return true;}
  catch(e){if(!silent)toast('合言葉が違います');return false;}
}
function renderPass(){
  $('#app').innerHTML=`<div><h1>職場の合言葉</h1><p class="sub">${esc(S.inv.w||'')}</p></div><div class="card">
    <label class="f" for="wp">管理者から聞いた「職場の合言葉」を入れてください</label>
    <input type="text" id="wp" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn primary block" id="wpGo" style="margin-top:12px">開く</button>
    <p class="note">はじめてのときだけ入れます（このスマホが覚えます）。職場の人だけが名簿を見られるようにするためのものです。</p></div>`;
  $('#wpGo').onclick=()=>unlock($('#wp').value,false);
}
function autoUnlock(){if(S.inv&&S.inv.e&&!S.unlocked){const sp=store.get(wpKey());if(sp)unlock(sp,true);}}
parseHash();if(S.kind==='invite')setupInvite();render();autoUnlock();
window.addEventListener('hashchange',()=>{parseHash();if(S.kind==='invite')setupInvite();S.reqStep=null;render();autoUnlock();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
